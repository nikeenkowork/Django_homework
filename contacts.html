<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sidebar d-flex flex-column justify-content-between" style="height: 100vh;">

    <div>
        <h4 class="mb-4">Меню</h4>

        <a class="d-block mb-2" href="home">Главная</a>
        <a class="d-block mb-2" href="categories">Категории</a>
        <a class="d-block mb-2" href="orders">Заказы</a>
        <a class="active d-block mb-2" href="contacts">Контакты</a>
    </div>

    <div class="mb-3">
        <div class="dropdown">
            <button class="btn btn-secondary w-100 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                Пользователь
            </button>

            <ul class="dropdown-menu w-100">
                <li><a class="dropdown-item" href="/profile">Профиль</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="/logout">Выход</a></li>
            </ul>
        </div>
    </div>

</div>

<div class="content p-4">

    <h1 class="mb-3">Контакты</h1>
    <p class="text-muted mb-4">Свяжитесь с нами или оставьте сообщение</p>

    <div class="row g-4">

        <!-- ФОРМА -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="mb-3">Написать нам</h5>

                    <form action="/contacts" method="post">

                        <div class="mb-3">
                            <label class="form-label">Имя</label>
                            <input type="text" name="name" class="form-control" placeholder="Ваше имя">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Почта</label>
                            <input type="email" name="email" class="form-control" placeholder="example@mail.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Сообщение</label>
                            <textarea name="message" class="form-control" rows="4" placeholder="Ваше сообщение..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Отправить
                        </button>

                    </form>

                </div>
            </div>
        </div>

        <!-- КОНТАКТЫ -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="mb-3">Наши контакты</h5>

                    <p>📞 Телефон: +7 999 777 77 77</p>
                    <p>📧 Email: info@example.com</p>
                    <p>📍 Адрес: Москва</p>

                    <hr>

                    <p class="text-muted">
                        Мы отвечаем в течение 24 часов
                    </p>

                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
