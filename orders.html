<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказы</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sidebar d-flex flex-column justify-content-between" style="height: 100vh;">

    <div>
        <h4 class="mb-4">Меню</h4>

        <a class="d-block mb-2" href="home">Главная</a>
        <a class="d-block mb-2" href="categories">Категории</a>
        <a class="active d-block mb-2" href="orders">Заказы</a>
        <a class="d-block mb-2" href="contacts">Контакты</a>
    </div>

    <div class="mb-3">
        <div class="dropdown">
            <button class="btn btn-secondary w-100 dropdown-toggle" data-bs-toggle="dropdown">
                Пользователь
            </button>

            <ul class="dropdown-menu w-100">
                <li><a class="dropdown-item" href="/profile">Профиль</a></li>
                <li><a class="dropdown-item text-danger" href="/logout">Выход</a></li>
            </ul>
        </div>
    </div>

</div>

<div class="content p-4">

    <h1 class="mb-3">Заказы</h1>
    <p class="text-muted mb-4">Список всех заказов</p>

    <div class="row g-3">

        <!-- Новый -->
        <div class="col-md-4">
            <div class="card shadow-sm border-warning">
                <div class="card-body">
                    <h5>Заказ #1045</h5>
                    <p class="text-muted">Иван Петров</p>
                    <span class="badge bg-warning text-dark">Новый</span>
                </div>
            </div>
        </div>

        <!-- В обработке -->
        <div class="col-md-4">
            <div class="card shadow-sm border-primary">
                <div class="card-body">
                    <h5>Заказ #1046</h5>
                    <p class="text-muted">Анна Смирнова</p>
                    <span class="badge bg-primary">В обработке</span>
                </div>
            </div>
        </div>

        <!-- Отправлен -->
        <div class="col-md-4">
            <div class="card shadow-sm border-info">
                <div class="card-body">
                    <h5>Заказ #1047</h5>
                    <p class="text-muted">Дмитрий Иванов</p>
                    <span class="badge bg-info">Отправлен</span>
                </div>
            </div>
        </div>

        <!-- Доставлен -->
        <div class="col-md-4">
            <div class="card shadow-sm border-success">
                <div class="card-body">
                    <h5>Заказ #1048</h5>
                    <p class="text-muted">Ольга Кузнецова</p>
                    <span class="badge bg-success">Доставлен</span>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
